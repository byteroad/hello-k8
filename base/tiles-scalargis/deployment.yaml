apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiles-scalargis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tiles-scalargis
  template:
    metadata:
      labels:
        app: tiles-scalargis
    spec:
      containers:
      - name: martin
        image: ghcr.io/maplibre/martin
        args:
        - "--auto-bounds"
        - "calc"
        - "--cache-size"
        - "2048"
        - "--keep-alive"
        - "200"
        - "--pool-size"
        - "20"
        - "--webui"
        - "disable"
        - "--default-srid"
        - "4326"
        - "--save-config"
        - "/tmp/config.yml"
        envFrom:
          - secretRef:
              name: app-secrets # The name of the Secret
        env:
          - name: DATABASE_URL
            valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REMOTE_SCALARGIS_URL
          - name: WATCH_MODE
            value: "true"
      hostAliases:
      - ip: "127.0.0.1"
        hostnames:
        - "host.docker.internal"



