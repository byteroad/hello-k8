apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pygeoapi
  namespace: ogcapi
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-connections: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ogcapi.dgterritorio.gov.pt
      secretName: pygeoapi-tls-secret
  rules:
    - host: ogcapi.dgterritorio.gov.pt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pygeoapi
                port:
                  name: http

---

apiVersion: v1
kind: Service
metadata:
  name: ogcapi-workshop-external
  namespace: ogcapi
spec:
  type: ExternalName
  externalName: ogcapi-workshop.ogc.org
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ogcapi-workshop-proxy
  namespace: ogcapi
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/upstream-vhost: ogcapi-workshop.ogc.org
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: ogcapi-workshop.ogc.org
    nginx.ingress.kubernetes.io/proxy-redirect-from: "https://ogcapi-workshop.ogc.org/"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "https://ogcapi.dgterritorio.gov.pt/ogcapi-workshop/"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ogcapi.dgterritorio.gov.pt
      secretName: pygeoapi-tls-secret
  rules:
    - host: ogcapi.dgterritorio.gov.pt
      http:
        paths:
          - path: /ogcapi-workshop(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ogcapi-workshop-external
                port:
                  number: 443

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pygeoapi-robots
  namespace: ogcapi
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /static/robots.txt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ogcapi.dgterritorio.gov.pt
      secretName: pygeoapi-tls-secret
  rules:
    - host: ogcapi.dgterritorio.gov.pt
      http:
        paths:
          - path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: pygeoapi
                port:
                  name: http