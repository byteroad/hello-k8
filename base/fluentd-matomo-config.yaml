apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-matomo-config
  namespace: ogcapi
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/nginx/access.log
      pos_file /var/log/fluentd-pos/nginx.pos
      tag nginx.access
      <parse>
        @type nginx
      </parse>
    </source>

    <filter nginx.access>
      @type record_transformer
      enable_ruby true
      renew_record true
      keep_keys path
      <record>
        qs ${"idsite=#{URI.encode_www_form_component(ENV['MATOMO_SITE_ID'].to_s)}&rec=1&apiv=1&action_name=Nginx%20Log&url=#{URI.encode_www_form_component('https://ogcapi.dgterritorio.gov.pt' + record['path'].to_s)}&cip=#{URI.encode_www_form_component(record['remote'].to_s)}&ua=#{URI.encode_www_form_component(record['agent'].to_s)}&cdt=#{URI.encode_www_form_component(Time.at(time.to_i).utc.strftime('%Y-%m-%d %H:%M:%S'))}&token_auth=#{URI.encode_www_form_component(ENV['MATOMO_TOKEN'].to_s)}"}
      </record>
    </filter>

    <match nginx.access>
      @type http
      endpoint "#{ENV['MATOMO_URL'].to_s.chomp('/')}/matomo.php"
      http_method post
      content_type application/x-www-form-urlencoded

      <format>
        @type single_value
        message_key qs
        add_newline false
      </format>

      <buffer>
        @type memory
        chunk_limit_records 1
        flush_mode immediate
        flush_thread_count 16
        total_limit_size 128MB
        queued_chunks_limit_size 20000
        overflow_action drop_oldest_chunk
        retry_type exponential_backoff
        retry_max_interval 30s
        retry_timeout 30m
      </buffer>
    </match>
