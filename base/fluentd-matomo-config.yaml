apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-matomo-config
  namespace: ogcapi
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/nginx/access.log
      pos_file /var/log/fluentd-pos/nginx.pos
      tag nginx.access
      <parse>
        @type nginx
      </parse>
    </source>

    <filter nginx.access>
      @type record_transformer
      enable_ruby true
      <record>
        qs ${ [
          ["idsite", ENV['MATOMO_SITE_ID']],
          ["rec", "1"],
          ["apiv", "1"],
          ["action_name", "Nginx Log"],
          ["url", "https://ogcapi.dgterritorio.gov.pt" + record["path"].to_s],
          ["cip", record["remote"].to_s],
          ["ua", record["agent"].to_s],
          ["cdt", Time.at(time.to_i).utc.strftime("%Y-%m-%d %H:%M:%S")],
          ["token_auth", ENV['MATOMO_TOKEN']]
        ].map { |k, v| "#{k}=#{URI.encode_www_form_component(v.to_s)}" }.join("&") }
      </record>
    </filter>

    <match nginx.access>
      @type http
      endpoint "#{ENV['MATOMO_URL'].to_s.chomp('/')}/matomo.php?${qs}"
      http_method post
      content_type text/plain
      <format>
        @type single_value
        message_key none
        add_newline false
      </format>
      <buffer qs>
        @type file
        path /var/log/fluentd-pos/buffer
        chunk_limit_records 1
        flush_interval 5s
        flush_thread_count 4
        retry_max_interval 30
        retry_forever true
      </buffer>
    </match>