apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-postgresql-0  # This MUST match the claimName used by your pod
  namespace: pygeoapi-demo
spec:
  storageClassName: "manual" # Must match the storageClassName in the PV
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi           # The requested size must be <= the PV's capacity